name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permisos minimos para publicar en Pages mediante OIDC, sin tokens guardados.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, y sin cancelar el que ya este en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifica que gradle-wrapper.jar sea un binario oficial y no uno manipulado.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/configure-pages@v5
        id: pages

      # "build" corre tambien los tests, asi que un fallo impide el despliegue.
      # base_path llega como "/personal-website" o vacio si algun dia es un
      # dominio propio; el generador normaliza ambos casos.
      - name: Build site
        run: ./gradlew build --no-daemon -PsitePath="${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
